# =============================================================================
# WORKFLOW: Azure Resource Group Creator (with AI Compliance Gate)
# =============================================================================
# This workflow automates Azure Resource Group provisioning via GitHub Issues.
#
# HOW IT WORKS:
# 1. User opens an issue using the "Request Azure Resource Group" template
# 2. The AI agent (Azure Guard) validates the request against rules in
#    .github/agents/azure-guard.agent.md
# 3. If PASS → creates the resource group in Azure and closes the issue
# 4. If FAIL → posts a comment with violations and blocks creation
#
# RESUBMIT FLOW:
# - User can edit the issue body to fix violations (auto re-triggers)
# - Or comment "/revalidate" to manually re-trigger validation
#
# REQUIRED SECRETS:
# - GH_MODELS_TOKEN: GitHub PAT with "models" permission (for AI API)
# - AZURE_CREDENTIALS: Service principal JSON (for Azure CLI)
# =============================================================================

name: Create Azure Resource Group

# --- TRIGGERS ---
# Runs when: issue opened, issue edited, or someone comments "/revalidate"
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  # ===========================================================================
  # JOB 1: AI COMPLIANCE GATE
  # Validates the issue request against rules before allowing Azure deployment
  # ===========================================================================
  azure-guard:
    # Only run for issues with "azure" label, or /revalidate comments on azure issues
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'azure')) ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'azure') && github.event.comment.body == '/revalidate')
    runs-on: ubuntu-latest
    permissions:
      issues: write       # Needed to post comments on the issue
      contents: read      # Needed to checkout repo and read rules file

    # Expose values to Job 2 (create-rg)
    outputs:
      decision: ${{ steps.precheck.outputs.decision == 'FAIL' && 'FAIL' || steps.guard.outputs.decision }}
      rg_name: ${{ steps.extract.outputs.rg_name }}
      region: ${{ steps.extract.outputs.region }}
      environment: ${{ steps.extract.outputs.environment }}
      owner: ${{ steps.extract.outputs.owner }}

    steps:
      # --- Clone the repo so we can read the rules file ---
      - name: Checkout repo
        uses: actions/checkout@v4

      # --- Deterministic field extraction (no AI needed for parsing) ---
      - name: "📋 Extract fields from issue body"
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # grep -A2: header line, blank line, value line
          extract() { echo "$ISSUE_BODY" | grep -A2 "### $1" | tail -1 | xargs; }
          echo "rg_name=$(extract 'Resource Group Name')" >> $GITHUB_OUTPUT
          echo "region=$(extract 'Azure Region')" >> $GITHUB_OUTPUT
          echo "environment=$(extract 'Environment')" >> $GITHUB_OUTPUT
          echo "owner=$(extract 'Owner')" >> $GITHUB_OUTPUT
          echo "project=$(extract 'Project')" >> $GITHUB_OUTPUT
          echo "cost_center=$(extract 'Cost Center')" >> $GITHUB_OUTPUT

      # --- Deterministic pre-flight validation ---
      - name: "🔍 Pre-flight validation"
        id: precheck
        run: |
          REPORT_FILE=$(mktemp)
          ERRORS=0
          fail() {
            echo "| $1 | $2 | ❌ Fail | $3 |" >> "$REPORT_FILE"
            ERRORS=$((ERRORS + 1))
          }

          RG="${{ steps.extract.outputs.rg_name }}"
          REGION="${{ steps.extract.outputs.region }}"
          ENV="${{ steps.extract.outputs.environment }}"
          OWNER="${{ steps.extract.outputs.owner }}"
          CC="${{ steps.extract.outputs.cost_center }}"

          # Required fields
          [ -z "$RG" ]     && fail "RG Name"      "_(empty)_" "Required field is empty"
          [ -z "$REGION" ] && fail "Region"        "_(empty)_" "Required field is empty"
          [ -z "$ENV" ]    && fail "Environment"   "_(empty)_" "Required field is empty"
          [ -z "$OWNER" ]  && fail "Owner"         "_(empty)_" "Required field is empty"
          [ -z "$CC" ]     && fail "Cost Center"   "_(empty)_" "Required field is empty"

          # RG name pattern: rg-<project>-<env>
          if [ -n "$RG" ]; then
            if ! echo "$RG" | grep -qE '^rg-[a-z0-9]+-(dev|staging|prod)$'; then
              fail "RG Name" "\`$RG\`" "Must match \`rg-<project>-<env>\`"
            else
              PROJ=$(echo "$RG" | cut -d'-' -f2)
              if [ ${#PROJ} -gt 15 ]; then
                fail "RG Name" "\`$RG\`" "Project \`$PROJ\` is ${#PROJ} chars (max 15)"
              fi
            fi
          fi

          # Environment value
          if [ -n "$ENV" ] && [ "$ENV" != "dev" ] && [ "$ENV" != "staging" ] && [ "$ENV" != "prod" ]; then
            fail "Environment" "\`$ENV\`" "Must be dev, staging, or prod"
          fi

          if [ $ERRORS -gt 0 ]; then
            echo "decision=FAIL" >> $GITHUB_OUTPUT
            {
              echo "report<<ENDREPORT"
              echo "| Field | Value | Status | Issue |"
              echo "|-------|-------|--------|-------|"
              cat "$REPORT_FILE"
              echo "ENDREPORT"
            } >> $GITHUB_OUTPUT
          else
            echo "decision=PASS" >> $GITHUB_OUTPUT
          fi

      - name: "❌ Pre-flight BLOCKED"
        if: steps.precheck.outputs.decision == 'FAIL'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🛡️ Azure Guard — Compliance Report

            ### Status: ❌ BLOCKED

            ${{ steps.precheck.outputs.report }}

            ---
            > 🤖 Pre-flight validation failed (deterministic check — no AI needed)
            >
            > **To fix:** Edit this issue with corrected values, or comment `/revalidate`.

      - name: "Block on pre-flight failure"
        if: steps.precheck.outputs.decision == 'FAIL'
        run: |
          echo "::error::Pre-flight validation failed."
          exit 1

      # --- Send pre-extracted fields + rules to the AI for validation ---
      - name: "🛡️ Azure Guard - AI Validation"
        id: guard
        if: steps.precheck.outputs.decision != 'FAIL'
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          RESPONSE=$(curl -s https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer $GH_MODELS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg system "You are Azure Guard, a strict Azure compliance validator for Resource Groups. Respond ONLY with valid JSON (no markdown fences). The 'report' field MUST be a markdown table (see Report Format in rules), never JSON arrays or bullet lists. IMPORTANT: The field values below have been pre-extracted from the issue. Use EXACTLY these values — do NOT substitute values from the title, GitHub username, or any other source. Owner can be ANY lowercase alphabetic string — there is no allowlist. Do NOT reject a valid lowercase name. Tags created-by and created-date are auto-set by the workflow — do NOT flag them as missing. If all fields are filled and naming is correct, return PASS. Do NOT invent violations." \
              --arg user "$(echo -e "Validate this Azure resource group request.\n\nSHARED RULES:\n$(cat .github/agents/guards/shared-rules.md)\n\nRESOURCE GROUP RULES:\n$(cat .github/agents/guards/rg-rules.md)\n\nPRE-EXTRACTED FIELDS:\n- RG Name: ${{ steps.extract.outputs.rg_name }}\n- Region: ${{ steps.extract.outputs.region }}\n- Environment: ${{ steps.extract.outputs.environment }}\n- Owner: ${{ steps.extract.outputs.owner }}\n- Project: ${{ steps.extract.outputs.project }}\n- Cost Center: ${{ steps.extract.outputs.cost_center }}")" \
              '{
                "model": "gpt-4o",
                "messages": [
                  {"role": "system", "content": $system},
                  {"role": "user", "content": $user}
                ],
                "temperature": 0
              }'
            )")

          AI_REPLY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          echo "AI Reply: $AI_REPLY"

          # Strip markdown code fences (```json ... ```) if the AI added them
          AI_REPLY=$(echo "$AI_REPLY" | sed '/^```/d')

          # ---------------------------------------------------------------
          # Extract fields from the AI's JSON and save as step outputs
          # ---------------------------------------------------------------
          echo "decision=$(echo "$AI_REPLY" | jq -r '.decision')" >> $GITHUB_OUTPUT
          echo "rg_name=$(echo "$AI_REPLY" | jq -r '.rg_name')" >> $GITHUB_OUTPUT
          echo "region=$(echo "$AI_REPLY" | jq -r '.region')" >> $GITHUB_OUTPUT
          echo "environment=$(echo "$AI_REPLY" | jq -r '.environment')" >> $GITHUB_OUTPUT
          echo "owner=$(echo "$AI_REPLY" | jq -r '.owner')" >> $GITHUB_OUTPUT

          # Multi-line output for the report (can contain newlines)
          REPORT=$(echo "$AI_REPLY" | jq -r '.report')
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- If FAIL: post a BLOCKED comment with the violation details ---
      - name: "❌ Comment - BLOCKED"
        if: steps.guard.outputs.decision == 'FAIL'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🛡️ Azure Guard — Compliance Report

            ### Status: ❌ BLOCKED

            ${{ steps.guard.outputs.report }}

            ---
            > 🤖 Validated by Azure Guard AI | Rules: `.github/agents/azure-guard.agent.md`
            >
            > **To fix:** Edit this issue with corrected values, or comment `/revalidate`.

      # --- If FAIL: stop the workflow (prevents Job 2 from running) ---
      - name: "Block on failure"
        if: steps.guard.outputs.decision == 'FAIL'
        run: |
          echo "::error::Azure Guard AI blocked this request."
          exit 1

      # --- If PASS: post a success comment ---
      - name: "✅ Comment - PASSED"
        if: steps.guard.outputs.decision == 'PASS'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🛡️ Azure Guard — Compliance Report

            ### Status: ✅ PASSED

            ${{ steps.guard.outputs.report }}

            ---
            > 🤖 Validated by Azure Guard AI. Proceeding with resource creation...

  # ===========================================================================
  # JOB 2: CREATE THE AZURE RESOURCE GROUP
  # Only runs if Job 1 (azure-guard) returned PASS
  # ===========================================================================
  create-rg:
    needs: azure-guard                                    # Wait for Job 1
    if: needs.azure-guard.outputs.decision == 'PASS'     # Only run on PASS
    runs-on: ubuntu-latest
    environment: azure-approval                           # Requires manual approval
    permissions:
      issues: write       # Needed to comment and close the issue

    steps:
      # --- Authenticate with Azure using service principal ---
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # --- Check if the resource group already exists ---
      - name: Check if RG exists
        id: check
        run: |
          if az group show --name "${{ needs.azure-guard.outputs.rg_name }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # --- If RG already exists, post a comment and skip creation ---
      - name: "⚠️ Comment - RG Already Exists"
        if: steps.check.outputs.exists == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⚠️ **Resource group `${{ needs.azure-guard.outputs.rg_name }}` already exists in Azure.**

            No changes were made. If you need a new resource group, use a different name.

      - name: "Block if exists"
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "::error::Resource group already exists."
          exit 1

      # --- Create the resource group with all required tags ---
      - name: Create Resource Group
        id: create
        run: |
          RESULT=$(az group create \
            --name "${{ needs.azure-guard.outputs.rg_name }}" \
            --location "${{ needs.azure-guard.outputs.region }}" \
            --tags \
              environment="${{ needs.azure-guard.outputs.environment }}" \
              owner="${{ needs.azure-guard.outputs.owner }}" \
              project="$(echo ${{ needs.azure-guard.outputs.rg_name }} | cut -d'-' -f2)" \
              cost-center="engineering" \
              created-by="github-actions" \
              created-date="$(date -u +%Y-%m-%d)" \
              issue-number="${{ github.event.issue.number }}")

          # Extract details from Azure response
          echo "resource_id=$(echo "$RESULT" | jq -r '.id')" >> $GITHUB_OUTPUT
          echo "provisioning_state=$(echo "$RESULT" | jq -r '.properties.provisioningState')" >> $GITHUB_OUTPUT
          echo "subscription=$(echo "$RESULT" | jq -r '.id' | cut -d'/' -f3)" >> $GITHUB_OUTPUT

      # --- Post success comment with resource details ---
      - name: "✅ Comment - Success"
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Resource Group Created Successfully!**

            | Property | Value |
            |----------|-------|
            | Name | `${{ needs.azure-guard.outputs.rg_name }}` |
            | Region | `${{ needs.azure-guard.outputs.region }}` |
            | Environment | `${{ needs.azure-guard.outputs.environment }}` |
            | Owner | `${{ needs.azure-guard.outputs.owner }}` |
            | Provisioning State | `${{ steps.create.outputs.provisioning_state }}` |
            | Resource ID | `${{ steps.create.outputs.resource_id }}` |
            | Subscription | `${{ steps.create.outputs.subscription }}` |
            | Created Date | `${{ github.event.issue.created_at }}` |

            🔗 [View in Azure Portal](https://portal.azure.com/#@/resource${{ steps.create.outputs.resource_id }})

      # --- Close the issue (request fulfilled) ---
      - name: Close issue
        if: success()
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "✅ Resource group provisioned and verified."

      # --- If Azure CLI fails, post error with link to logs ---
      - name: "❌ Comment - Deployment Failed"
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Azure deployment failed.** Check [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  # ===========================================================================
  # JOB 3: NOTIFY ON REJECTION
  # Posts a comment if the manual approval was rejected
  # ===========================================================================
  notify-rejection:
    needs: [azure-guard, create-rg]
    if: always() && needs.azure-guard.result == 'success' && needs.create-rg.result != 'success' && needs.create-rg.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: "🚫 Comment - Approval Rejected"
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🚫 Deployment Rejected

            A reviewer **rejected** the manual approval for this resource group request.

            | Property | Value |
            |----------|-------|
            | Resource Group | `${{ needs.azure-guard.outputs.rg_name }}` |
            | Region | `${{ needs.azure-guard.outputs.region }}` |
            | Reviewer Action | Rejected |

            ---
            > To retry, comment `/revalidate` after discussing with the reviewer.

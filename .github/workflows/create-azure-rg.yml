name: Create Azure Resource Group

on:
  issues:
    types: [opened]

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'azure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      rg_name: ${{ steps.fields.outputs.rg_name }}
      region: ${{ steps.fields.outputs.region }}
      environment: ${{ steps.fields.outputs.environment }}
      owner: ${{ steps.fields.outputs.owner }}

    steps:
      - name: Extract fields
        id: fields
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          RG_NAME=$(echo "$BODY" | awk '/^### Resource Group Name/{found=1; next} found && /^[^#]/ && NF{print; exit}')
          REGION=$(echo "$BODY" | awk '/^### Azure Region/{found=1; next} found && /^[^#]/ && NF{print; exit}')
          ENVIRONMENT=$(echo "$BODY" | awk '/^### Environment/{found=1; next} found && /^[^#]/ && NF{print; exit}')
          OWNER=$(echo "$BODY" | awk '/^### Owner/{found=1; next} found && /^[^#]/ && NF{print; exit}')
          
          echo "rg_name=$RG_NAME" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

      - name: "🛡️ Azure Guard - Validate Naming Convention"
        id: check-naming
        run: |
          RG_NAME="${{ steps.fields.outputs.rg_name }}"
          ERRORS=""

          # Rule 1: Must start with "rg-"
          if [[ ! "$RG_NAME" =~ ^rg- ]]; then
            ERRORS="${ERRORS}❌ Name must start with \`rg-\`. Got: \`$RG_NAME\`\n"
          fi

          # Rule 2: Must follow rg-<project>-<env> pattern
          if [[ ! "$RG_NAME" =~ ^rg-[a-z0-9]+-[a-z]+$ ]]; then
            ERRORS="${ERRORS}❌ Name must match pattern \`rg-<project>-<env>\`. Got: \`$RG_NAME\`\n"
          fi

          # Rule 3: Must end with valid environment
          if [[ ! "$RG_NAME" =~ -(dev|staging|prod)$ ]]; then
            ERRORS="${ERRORS}❌ Name must end with \`-dev\`, \`-staging\`, or \`-prod\`. Got: \`$RG_NAME\`\n"
          fi

          # Rule 4: No uppercase
          if [[ "$RG_NAME" =~ [A-Z] ]]; then
            ERRORS="${ERRORS}❌ Name must be lowercase. Got: \`$RG_NAME\`\n"
          fi

          # Rule 5: No generic names
          if [[ "$RG_NAME" =~ (test|temp|my|resource1|example) ]]; then
            ERRORS="${ERRORS}❌ Generic names not allowed (test, temp, my, resource1). Got: \`$RG_NAME\`\n"
          fi

          if [ -n "$ERRORS" ]; then
            echo "naming_errors<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "naming_pass=false" >> $GITHUB_OUTPUT
          else
            echo "naming_pass=true" >> $GITHUB_OUTPUT
          fi

      - name: "🛡️ Azure Guard - Validate Region"
        id: check-region
        run: |
          REGION="${{ steps.fields.outputs.region }}"
          ALLOWED="eastus westus2 centralindia southeastasia westeurope"
          ERRORS=""

          if [[ ! " $ALLOWED " =~ " $REGION " ]]; then
            ERRORS="❌ Region \`$REGION\` is not allowed. Allowed: \`$ALLOWED\`"
          fi

          if [ -n "$ERRORS" ]; then
            echo "region_errors=$ERRORS" >> $GITHUB_OUTPUT
            echo "region_pass=false" >> $GITHUB_OUTPUT
          else
            echo "region_pass=true" >> $GITHUB_OUTPUT
          fi

      - name: "🛡️ Azure Guard - Validate Owner"
        id: check-owner
        run: |
          OWNER="${{ steps.fields.outputs.owner }}"
          ERRORS=""

          if [ -z "$OWNER" ]; then
            ERRORS="❌ Owner field is required and cannot be empty"
          fi

          if [[ "$OWNER" =~ [A-Z] ]]; then
            ERRORS="${ERRORS}\n❌ Owner must be lowercase. Got: \`$OWNER\`"
          fi

          if [ -n "$ERRORS" ]; then
            echo "owner_errors<<EOF" >> $GITHUB_OUTPUT
            echo -e "$ERRORS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "owner_pass=false" >> $GITHUB_OUTPUT
          else
            echo "owner_pass=true" >> $GITHUB_OUTPUT
          fi

      - name: "🛡️ Azure Guard - Validate Environment Consistency"
        id: check-env
        run: |
          RG_NAME="${{ steps.fields.outputs.rg_name }}"
          ENVIRONMENT="${{ steps.fields.outputs.environment }}"
          ERRORS=""

          # Environment in dropdown must match the suffix in the RG name
          if [[ "$RG_NAME" == *"-dev" && "$ENVIRONMENT" != "dev" ]] || \
             [[ "$RG_NAME" == *"-staging" && "$ENVIRONMENT" != "staging" ]] || \
             [[ "$RG_NAME" == *"-prod" && "$ENVIRONMENT" != "production" && "$ENVIRONMENT" != "prod" ]]; then
            ERRORS="❌ Environment mismatch: RG name ends with a different env than selected. Name: \`$RG_NAME\`, Selected: \`$ENVIRONMENT\`"
          fi

          if [ -n "$ERRORS" ]; then
            echo "env_errors=$ERRORS" >> $GITHUB_OUTPUT
            echo "env_pass=false" >> $GITHUB_OUTPUT
          else
            echo "env_pass=true" >> $GITHUB_OUTPUT
          fi

      - name: "🛡️ Azure Guard - Compliance Report (FAIL)"
        if: steps.check-naming.outputs.naming_pass == 'false' || steps.check-region.outputs.region_pass == 'false' || steps.check-owner.outputs.owner_pass == 'false' || steps.check-env.outputs.env_pass == 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🛡️ Azure Guard — Compliance Report

            ### Status: ❌ BLOCKED

            Your request does not meet compliance standards. Please fix the violations below and **create a new issue**.

            ---

            #### Naming Convention
            ${{ steps.check-naming.outputs.naming_pass == 'true' && '✅ PASS' || steps.check-naming.outputs.naming_errors }}

            **Required pattern:** `rg-<project>-<env>` where env is `dev`, `staging`, or `prod`
            **Examples:** `rg-webapp-dev`, `rg-payments-prod`, `rg-analytics-staging`

            ---

            #### Region
            ${{ steps.check-region.outputs.region_pass == 'true' && '✅ PASS' || steps.check-region.outputs.region_errors }}

            ---

            #### Owner
            ${{ steps.check-owner.outputs.owner_pass == 'true' && '✅ PASS' || steps.check-owner.outputs.owner_errors }}

            ---

            #### Environment Consistency
            ${{ steps.check-env.outputs.env_pass == 'true' && '✅ PASS' || steps.check-env.outputs.env_errors }}

            ---

            > 💡 **Tip:** The resource group name must end with the same environment you selected in the dropdown.

      - name: "🛡️ Azure Guard - Block on failure"
        if: steps.check-naming.outputs.naming_pass == 'false' || steps.check-region.outputs.region_pass == 'false' || steps.check-owner.outputs.owner_pass == 'false' || steps.check-env.outputs.env_pass == 'false'
        run: |
          echo "::error::Azure Guard blocked this request due to compliance violations."
          exit 1

      - name: "🛡️ Azure Guard - Compliance Report (PASS)"
        if: steps.check-naming.outputs.naming_pass == 'true' && steps.check-region.outputs.region_pass == 'true' && steps.check-owner.outputs.owner_pass == 'true' && steps.check-env.outputs.env_pass == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🛡️ Azure Guard — Compliance Report

            ### Status: ✅ PASSED

            | Rule | Status |
            |------|--------|
            | Naming Convention | ✅ |
            | Region Allowed | ✅ |
            | Owner Valid | ✅ |
            | Environment Consistency | ✅ |

            Proceeding with resource creation...

  create-rg:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create \
            --name "${{ needs.validate.outputs.rg_name }}" \
            --location "${{ needs.validate.outputs.region }}" \
            --tags \
              environment="${{ needs.validate.outputs.environment }}" \
              owner="${{ needs.validate.outputs.owner }}" \
              project="$(echo ${{ needs.validate.outputs.rg_name }} | cut -d'-' -f2)" \
              cost-center="engineering" \
              created-by="github-actions" \
              issue-number="${{ github.event.issue.number }}"

      - name: Comment on issue - Success
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Resource Group Created Successfully!**
            
            | Property | Value |
            |----------|-------|
            | Name | `${{ needs.validate.outputs.rg_name }}` |
            | Region | `${{ needs.validate.outputs.region }}` |
            | Environment | `${{ needs.validate.outputs.environment }}` |
            | Owner | `${{ needs.validate.outputs.owner }}` |
            | Tags | environment, owner, project, cost-center, created-by |
            
            The resource group is now available in Azure.

      - name: Close issue on success
        if: success()
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Closing - resource group has been provisioned. ✅"

      - name: Comment on issue - Failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Failed to create Resource Group**
            
            Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

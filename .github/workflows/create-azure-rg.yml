name: Create Azure Resource Group

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  azure-guard:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'azure')) ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'azure') && github.event.comment.body == '/revalidate')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    outputs:
      decision: ${{ steps.guard.outputs.decision }}
      rg_name: ${{ steps.extract.outputs.rg_name }}
      region: ${{ steps.extract.outputs.region }}
      environment: ${{ steps.extract.outputs.environment }}
      owner: ${{ steps.extract.outputs.owner }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read Azure Guard rules
        id: rules
        run: |
          RULES=$(cat .github/agents/azure-guard.agent.md)
          echo "rules<<EOF" >> $GITHUB_OUTPUT
          echo "$RULES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: "🛡️ Azure Guard - AI Validation"
        id: guard
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Build the prompt for the AI agent
          PROMPT=$(cat <<'PROMPT_END'
          You are Azure Guard. You enforce the rules defined below.

          ## RULES:
          ${{ steps.rules.outputs.rules }}

          ## ISSUE TO VALIDATE:
          Title: ${ISSUE_TITLE}
          Body:
          ${ISSUE_BODY}

          ## YOUR TASK:
          1. Validate the issue inputs against ALL rules (naming, tags, region, security)
          2. Return your response as JSON ONLY (no markdown, no explanation outside JSON):

          {
            "decision": "PASS" or "FAIL",
            "report": "Your markdown compliance report with ✅/❌ for each rule",
            "rg_name": "extracted resource group name",
            "region": "extracted region",
            "environment": "extracted environment",
            "owner": "extracted owner",
            "violations": ["list of violation descriptions"] or []
          }

          Return ONLY the JSON object. Nothing else.
          PROMPT_END
          )

          # Call GitHub Models API (AI inference)
          RESPONSE=$(curl -s https://models.inference.ai.azure.com/chat/completions \
            -H "Authorization: Bearer $GH_MODELS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg system "You are Azure Guard, a strict Azure compliance validator. Only respond with valid JSON." \
              --arg user "$(echo -e "Validate this Azure resource request against the rules.\n\nRULES FILE:\n$(cat .github/agents/azure-guard.agent.md)\n\nISSUE TITLE: $ISSUE_TITLE\n\nISSUE BODY:\n$ISSUE_BODY\n\nRespond with JSON only: {\"decision\": \"PASS\" or \"FAIL\", \"report\": \"markdown compliance report\", \"rg_name\": \"extracted name\", \"region\": \"extracted region\", \"environment\": \"extracted env\", \"owner\": \"extracted owner\", \"violations\": [\"list\"] }")" \
              '{
                "model": "gpt-4o-mini",
                "messages": [
                  {"role": "system", "content": $system},
                  {"role": "user", "content": $user}
                ],
                "temperature": 0
              }'
            )")

          echo "Raw response: $RESPONSE"

          # Extract the AI's JSON response
          AI_REPLY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          echo "AI Reply: $AI_REPLY"

          # Strip markdown code fences if present
          AI_REPLY=$(echo "$AI_REPLY" | sed '/^```/d')

          # Parse decision
          DECISION=$(echo "$AI_REPLY" | jq -r '.decision')
          REPORT=$(echo "$AI_REPLY" | jq -r '.report')
          RG_NAME=$(echo "$AI_REPLY" | jq -r '.rg_name')
          REGION=$(echo "$AI_REPLY" | jq -r '.region')
          ENVIRONMENT=$(echo "$AI_REPLY" | jq -r '.environment')
          OWNER=$(echo "$AI_REPLY" | jq -r '.owner')

          echo "decision=$DECISION" >> $GITHUB_OUTPUT
          echo "rg_name=$RG_NAME" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

          # Save report for commenting
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract fields (fallback)
        id: extract
        run: |
          echo "rg_name=${{ steps.guard.outputs.rg_name }}" >> $GITHUB_OUTPUT
          echo "region=${{ steps.guard.outputs.region }}" >> $GITHUB_OUTPUT
          echo "environment=${{ steps.guard.outputs.environment }}" >> $GITHUB_OUTPUT
          echo "owner=${{ steps.guard.outputs.owner }}" >> $GITHUB_OUTPUT

      - name: "🛡️ Comment - BLOCKED"
        if: steps.guard.outputs.decision == 'FAIL'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🛡️ Azure Guard — Compliance Report

            ### Status: ❌ BLOCKED

            ${{ steps.guard.outputs.report }}

            ---
            > 🤖 This validation was performed by the Azure Guard AI agent.
            > Rules are defined in `.github/agents/azure-guard.agent.md`
            >
            > Please fix the violations and create a new issue.

      - name: "Block on failure"
        if: steps.guard.outputs.decision == 'FAIL'
        run: |
          echo "::error::Azure Guard AI blocked this request."
          exit 1

      - name: "🛡️ Comment - PASSED"
        if: steps.guard.outputs.decision == 'PASS'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ## 🛡️ Azure Guard — Compliance Report

            ### Status: ✅ PASSED

            ${{ steps.guard.outputs.report }}

            ---
            > 🤖 Validated by Azure Guard AI. Proceeding with resource creation...

  create-rg:
    needs: azure-guard
    if: needs.azure-guard.outputs.decision == 'PASS'
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create \
            --name "${{ needs.azure-guard.outputs.rg_name }}" \
            --location "${{ needs.azure-guard.outputs.region }}" \
            --tags \
              environment="${{ needs.azure-guard.outputs.environment }}" \
              owner="${{ needs.azure-guard.outputs.owner }}" \
              project="$(echo ${{ needs.azure-guard.outputs.rg_name }} | cut -d'-' -f2)" \
              cost-center="engineering" \
              created-by="github-actions" \
              issue-number="${{ github.event.issue.number }}"

      - name: Comment - Success
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Resource Group Created Successfully!**
            
            | Property | Value |
            |----------|-------|
            | Name | `${{ needs.azure-guard.outputs.rg_name }}` |
            | Region | `${{ needs.azure-guard.outputs.region }}` |
            | Environment | `${{ needs.azure-guard.outputs.environment }}` |
            | Owner | `${{ needs.azure-guard.outputs.owner }}` |

      - name: Close issue
        if: success()
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "✅ Resource group provisioned and verified."

      - name: Comment - Failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Azure deployment failed.** Check [logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

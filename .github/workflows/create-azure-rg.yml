name: Create Azure Resource Group

on:
  issues:
    types: [opened]

jobs:
  create-rg:
    if: contains(github.event.issue.labels.*.name, 'azure')
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Extract fields
        id: fields
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          # Extract Resource Group Name
          RG_NAME=$(echo "$BODY" | sed -n '/### Resource Group Name/{n;/^$/d;p;}' | head -1 | xargs)
          echo "rg_name=$RG_NAME" >> $GITHUB_OUTPUT
          
          # Extract Region
          REGION=$(echo "$BODY" | sed -n '/### Azure Region/{n;/^$/d;p;}' | head -1 | xargs)
          echo "region=$REGION" >> $GITHUB_OUTPUT
          
          # Extract Environment
          ENVIRONMENT=$(echo "$BODY" | sed -n '/### Environment/{n;/^$/d;p;}' | head -1 | xargs)
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          
          # Extract Owner
          OWNER=$(echo "$BODY" | sed -n '/### Owner/{n;/^$/d;p;}' | head -1 | xargs)
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          
          echo "Parsed: RG=$RG_NAME, Region=$REGION, Env=$ENVIRONMENT, Owner=$OWNER"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create \
            --name "${{ steps.fields.outputs.rg_name }}" \
            --location "${{ steps.fields.outputs.region }}" \
            --tags \
              environment="${{ steps.fields.outputs.environment }}" \
              owner="${{ steps.fields.outputs.owner }}" \
              created-by="github-actions" \
              issue-number="${{ github.event.issue.number }}"

      - name: Comment on issue - Success
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Resource Group Created Successfully!**
            
            | Property | Value |
            |----------|-------|
            | Name | `${{ steps.fields.outputs.rg_name }}` |
            | Region | `${{ steps.fields.outputs.region }}` |
            | Environment | `${{ steps.fields.outputs.environment }}` |
            | Owner | `${{ steps.fields.outputs.owner }}` |
            
            The resource group is now available in Azure.

      - name: Close issue on success
        if: success()
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Closing - resource group has been provisioned."

      - name: Comment on issue - Failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Failed to create Resource Group**
            
            Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          
